<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progetto - Kanban</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/team.css">
  <script src="../js/tema.js"></script>
  <script src="../js/storage.js" defer></script>
  <script src="../js/dati.js" defer></script>
  <script src="../js/board.js" defer></script>
</head>
<body>
  <header class="topbar topbar-fissa">
    <a href="progetti.html" class="btn btn-secondario">&larr; Torna ai Progetti</a>
    <h1 id="titolo-progetto"></h1>
    <div class="utente">
      <span><strong id="utente-corrente"></strong></span>
      <button type="button" id="btn-logout" class="btn btn-secondario">Esci</button>
    </div>
  </header>

  <main class="contenitore">
    <section class="team" aria-label="Team del progetto">
      <h2>Team</h2>
      <form id="form-team" class="form-team">
        <input type="text" id="nome-partecipante" placeholder="Nome o email del partecipante" maxlength="60" autocomplete="off">
        <button type="submit" class="btn btn-secondario">+ Aggiungi</button>
      </form>
      <ul id="elenco-team" class="elenco-team"></ul>
      <p id="team-vuoto" class="progetto-info">Nessun partecipante: aggiungine uno per poter assegnare le attività.</p>
    </section>

    <section class="avanzamento" aria-label="Avanzamento del progetto">
      <div class="barra"><div class="barra-riempita" id="barra"></div></div>
      <p id="testo-avanzamento" class="progetto-info"></p>
      <button type="button" id="btn-nuova" class="btn btn-primario">+ Nuova attività</button>
    </section>

    <section id="board" class="board" aria-label="Board">
      <section class="colonna-box" data-stato="da-fare">
        <h2>Da fare <span class="contatore" id="conteggio-da-fare">0</span></h2>
        <div class="colonna" id="colonna-da-fare"></div>
      </section>
      <section class="colonna-box" data-stato="in-corso">
        <h2>In corso <span class="contatore" id="conteggio-in-corso">0</span></h2>
        <div class="colonna" id="colonna-in-corso"></div>
      </section>
      <section class="colonna-box" data-stato="completato">
        <h2>Completato <span class="contatore" id="conteggio-completato">0</span></h2>
        <div class="colonna" id="colonna-completato"></div>
      </section>
    </section>
  </main>

  <dialog id="dialog-attivita">
    <form id="form-attivita" novalidate>
      <h2 id="dialog-titolo">Nuova attività</h2>
      <input type="hidden" id="att-id">

      <label for="att-titolo">Titolo *</label>
      <input type="text" id="att-titolo" maxlength="100" autocomplete="off">

      <label for="att-descrizione">Descrizione</label>
      <textarea id="att-descrizione" rows="3" maxlength="500"></textarea>

      <div class="riga">
        <div>
          <label for="att-priorita">Priorità</label>
          <select id="att-priorita">
            <option value="bassa">Bassa</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <div>
          <label for="att-stato">Stato</label>
          <select id="att-stato">
            <option value="da-fare" selected>Da fare</option>
            <option value="in-corso">In corso</option>
            <option value="completato">Completato</option>
          </select>
        </div>
      </div>

      <p class="etichetta">Assegnata a</p>
      <details class="tendina">
        <summary id="riepilogo-assegnatari">Nessuno</summary>
        <div id="lista-assegnatari" class="lista-assegnatari"></div>
      </details>

      <p id="errore-titolo" class="errore" role="alert" hidden>Il titolo è obbligatorio.</p>

      <div class="azioni-form">
        <button type="button" id="btn-annulla" class="btn btn-secondario">Annulla</button>
        <button type="submit" class="btn btn-primario">Salva</button>
      </div>
    </form>
  </dialog>

  <template id="template-attivita">
    <article class="scheda" draggable="true">
      <h3 class="scheda-titolo"></h3>
      <p class="scheda-descrizione"></p>
      <div class="meta">
        <span class="badge scheda-priorita"></span>
        <span class="scheda-assegnatario"></span>
      </div>
      <div class="azioni">
        <button type="button" class="btn-icona btn-indietro" aria-label="Sposta indietro">&larr;</button>
        <button type="button" class="btn-icona btn-avanti" aria-label="Sposta avanti">&rarr;</button>
        <button type="button" class="btn-testo btn-modifica">Modifica</button>
        <button type="button" class="btn-testo btn-elimina">Elimina</button>
      </div>
    </article>
  </template>
</body>
</html>
